name: Optimize website images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Optimize JPEG images
        run: |
          magick bilder/hero.jpg -strip -interlace Plane -sampling-factor 4:2:0 -quality 82 bilder/hero.jpg
          magick bilder/show-1.jpg -strip -interlace Plane -sampling-factor 4:2:0 -quality 84 bilder/show-1.jpg
          magick bilder/show-2.jpg -strip -interlace Plane -sampling-factor 4:2:0 -quality 84 bilder/show-2.jpg
          magick bilder/show-3.jpg -strip -interlace Plane -sampling-factor 4:2:0 -quality 84 bilder/show-3.jpg

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/hero.jpg bilder/show-1.jpg bilder/show-2.jpg bilder/show-3.jpg
          if git diff --cached --quiet; then
            echo "No image changes needed."
          else
            git commit -m "Optimize website image assets"
            git push
          fi
