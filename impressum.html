<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Impressum – [Künstlername]</title>
  <!--
    Impressum für Kleinkünstler/innen (§ 5 DDG), Stand Oktober 2026.
    Platzhalter in [eckigen Klammern] ersetzen. Keine Rechtsberatung.
    - Bürgerlicher Name ist Pflicht, Künstlername optional zusätzlich.
    - Anschrift: kein Postfach, keine Agenturadresse. Alternativ c/o-Impressumsservice.
    - USt-IdNr. nur angeben, wenn vorhanden (Kleinunternehmer meist nicht) – sonst Abschnitt löschen.
    - Impressum von jeder Seite aus verlinken (Footer).
  -->
  <style>
    :root { --bg:#fff; --text:#1f2328; --muted:#59636e; --border:#d1d9e0; --accent:#0969da; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --text:#e6edf3; --muted:#9198a1; --border:#30363d; --accent:#4493f8; }
    }
    body { margin:0; background:var(--bg); color:var(--text);
           font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.6; }
    main { max-width:640px; margin:0 auto; padding:2.5rem 1rem 4rem; }
    h1 { margin:0 0 1.5rem; }
    h2 { font-size:1.1rem; margin:2rem 0 .5rem; padding-top:1.25rem; border-top:1px solid var(--border); }
    p, address { margin:0 0 .75rem; font-style:normal; }
    a { color:var(--accent); }
    footer { margin-top:3rem; font-size:.85rem; color:var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>Impressum</h1>

  <h2>Angaben gemäß § 5 DDG</h2>
  <address>
    Benjamin Miller<br>
    <!-- optional: Künstlername: [Künstlername]<br> -->
    <!-- optional: c/o [Impressumsservice]<br>--> 
    Hochreuth 1<br>
    91088 Bubenreuth<br>
    Deutschland
  </address>

  <h2>Kontakt</h2>
  <p>
    E-Mail: <a href="mailto:[benjaminmiller.magic@gmail.com]">benjaminmiller.magic@gmail.com</a><br>
    Telefon: +49 15903015903
  </p>

  <!-- NUR wenn vorhanden, sonst diesen Abschnitt löschen
  <h2>Umsatzsteuer-ID</h2>
  <p>Umsatzsteuer-Identifikationsnummer gemäß § 27a UStG: [DE123456789]</p> -->

  <!-- Empfohlen, wenn fremde Fotos genutzt werden 
  <h2>Bildnachweise</h2>
  <p>Fotos: [Name Fotograf/in]</p>-->

  <footer>
    <p><a href="datenschutz.html">Datenschutzerklärung</a> · <a href="/">Startseite</a></p>
  </footer>
</main>
</body>
</html>
